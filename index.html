<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎁 Daily Rewards</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            width: 100%;
        }
        
        .card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }
        
        .user-section {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        
        input {
            flex: 1;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            min-width: 200px;
        }
        
        button {
            padding: 15px 30px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102,126,234,0.4);
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }
        
        .stat-card {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }
        
        .stat-value {
            font-size: 2em;
            font-weight: bold;
            color: #667eea;
        }
        
        .claim-btn {
            width: 100%;
            padding: 20px;
            font-size: 1.2em;
            margin: 20px 0;
            background: linear-gradient(135deg, #48bb78, #38a169);
        }
        
        .timer {
            text-align: center;
            font-size: 2em;
            font-weight: bold;
            color: #764ba2;
            margin: 20px 0;
            font-family: monospace;
        }
        
        .ranking {
            margin-top: 30px;
        }
        
        .ranking-item {
            display: flex;
            justify-content: space-between;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
            margin-bottom: 10px;
        }
        
        .message {
            text-align: center;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            display: none;
        }
        
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>🎁 Daily Rewards</h1>
            
            <div class="user-section">
                <input type="text" id="userId" placeholder="Seu ID do Discord">
                <input type="text" id="username" placeholder="Seu nome">
                <button onclick="loadUser()">Carregar</button>
            </div>
            
            <div class="stats">
                <div class="stat-card">
                    <div>Saldo</div>
                    <div class="stat-value" id="balance">0</div>
                </div>
                <div class="stat-card">
                    <div>Streak</div>
                    <div class="stat-value" id="streak">0</div>
                </div>
                <div class="stat-card">
                    <div>Total</div>
                    <div class="stat-value" id="totalEarned">0</div>
                </div>
            </div>
            
            <div class="timer" id="timer">--:--:--</div>
            
            <button class="claim-btn" onclick="claimDaily()" id="claimBtn">
                🎁 RESGATAR DIÁRIO
            </button>
            
            <div class="ranking">
                <h3>🏆 Top 10</h3>
                <div id="ranking"></div>
            </div>
            
            <div id="message" class="message"></div>
        </div>
    </div>

    <script>
        const API_URL = 'https://seu-site.vercel.app/api';
        let currentUser = null;
        let timerInterval = null;
        
        async function loadUser() {
            const userId = document.getElementById('userId').value;
            if (!userId) return showMessage('Digite seu ID', 'error');
            
            try {
                const res = await fetch(`${API_URL}/user/${userId}`);
                const data = await res.json();
                currentUser = data;
                updateUI();
                showMessage('Usuário carregado!', 'success');
            } catch (error) {
                showMessage('Erro ao carregar', 'error');
            }
        }
        
        async function claimDaily() {
            if (!currentUser) return showMessage('Carregue um usuário', 'error');
            
            const username = document.getElementById('username').value || currentUser.username || 'Usuário';
            
            try {
                const res = await fetch(`${API_URL}/claim/${currentUser.user_id}`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({username})
                });
                const data = await res.json();
                
                if (data.success) {
                    showMessage(`🎉 Ganhou ${data.amount} moedas! Streak: ${data.streak}`, 'success');
                    await loadUser();
                } else {
                    showMessage(data.message, 'error');
                }
            } catch (error) {
                showMessage('Erro ao resgatar', 'error');
            }
        }
        
        async function loadRanking() {
            try {
                const res = await fetch(`${API_URL}/top`);
                const data = await res.json();
                const ranking = document.getElementById('ranking');
                ranking.innerHTML = data.map((user, i) => `
                    <div class="ranking-item">
                        <span>${i+1}º ${user.username || 'Anônimo'}</span>
                        <span>💰 ${user.balance}</span>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Erro ranking:', error);
            }
        }
        
        function updateUI() {
            if (currentUser) {
                document.getElementById('balance').textContent = currentUser.balance || 0;
                document.getElementById('streak').textContent = currentUser.daily_streak || 0;
                document.getElementById('totalEarned').textContent = currentUser.total_earned || 0;
            }
        }
        
        function showMessage(text, type) {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.className = `message ${type}`;
            msg.style.display = 'block';
            setTimeout(() => msg.style.display = 'none', 3000);
        }
        
        loadRanking();
        setInterval(loadRanking, 30000);
    </script>
</body>
</html>
