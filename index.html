<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Julia Rewards - Sistema de Resgate</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        :root {
            --primary: #8B5CF6;
            --secondary: #EC4899;
            --success: #10B981;
            --danger: #EF4444;
            --warning: #F59E0B;
            --dark: #1F2937;
            --light: #F9FAFB;
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            position: relative;
            overflow-x: hidden;
        }
        
        .container {
            max-width: 800px;
            width: 100%;
            position: relative;
            z-index: 1;
        }
        
        /* Header */
        .header {
            text-align: center;
            margin-bottom: 24px;
        }
        
        .logo {
            font-size: 64px;
            line-height: 1;
            margin-bottom: 8px;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.3));
            animation: float 3s ease-in-out infinite;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }
        
        h1 {
            font-size: clamp(32px, 8vw, 48px);
            font-weight: 800;
            color: white;
            text-shadow: 0 5px 15px rgba(0,0,0,0.3);
            margin-bottom: 4px;
        }
        
        .badge {
            display: inline-block;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            padding: 6px 16px;
            border-radius: 100px;
            color: white;
            font-size: 14px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        /* Card principal */
        .card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 32px;
            padding: clamp(20px, 5vw, 32px);
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.2);
        }
        
        /* Área do usuário */
        .user-area {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }
        
        .input-group {
            flex: 1;
            min-width: 200px;
        }
        
        .input-group input {
            width: 100%;
            padding: 16px 20px;
            background: white;
            border: 2px solid #E5E7EB;
            border-radius: 16px;
            font-size: 16px;
            transition: all 0.3s;
        }
        
        .input-group input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(139,92,246,0.1);
        }
        
        .btn {
            padding: 16px 32px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            border-radius: 16px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 10px 20px -5px rgba(139,92,246,0.5);
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 20px 30px -5px rgba(139,92,246,0.7);
        }
        
        .btn:active {
            transform: translateY(0);
        }
        
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        /* Stats */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }
        
        .stat-card {
            background: #F9FAFB;
            border-radius: 20px;
            padding: 20px 12px;
            text-align: center;
            border: 1px solid #E5E7EB;
            overflow: hidden;
        }
        
        .stat-icon {
            font-size: 28px;
            margin-bottom: 8px;
        }
        
        .stat-label {
            color: #6B7280;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 4px;
            white-space: nowrap;
        }
        
        .stat-value {
            font-size: clamp(24px, 4vw, 32px);
            font-weight: 700;
            color: var(--primary);
            line-height: 1.2;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        /* Timer */
        .timer-card {
            background: linear-gradient(135deg, rgba(139,92,246,0.05), rgba(236,72,153,0.05));
            border: 2px dashed var(--primary);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            margin-bottom: 20px;
        }
        
        .timer-label {
            color: #6B7280;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }
        
        .timer-display {
            font-size: clamp(36px, 8vw, 56px);
            font-weight: 700;
            color: var(--primary);
            font-family: 'Courier New', monospace;
        }
        
        /* Botão de resgate */
        .claim-btn {
            width: 100%;
            padding: 24px;
            font-size: 1.4rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--success), #059669);
            border-radius: 30px;
            margin-bottom: 24px;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 20px 40px -10px rgba(16,185,129,0.5);
        }
        
        /* Área de pergunta */
        .question-card {
            background: linear-gradient(135deg, #FEF3C7, #FDE68A);
            border-radius: 24px;
            padding: 24px;
            margin-bottom: 24px;
            border: 2px solid var(--warning);
            animation: slideIn 0.3s ease;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .question-title {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #92400E;
            font-weight: 600;
            margin-bottom: 12px;
        }
        
        .question-text {
            font-size: 1.2rem;
            font-weight: 500;
            color: #1F2937;
            margin-bottom: 16px;
        }
        
        .question-input {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        
        .question-input input {
            flex: 1;
            padding: 14px 18px;
            border: 2px solid #D1D5DB;
            border-radius: 16px;
            font-size: 16px;
            min-width: 200px;
        }
        
        .question-input input:focus {
            outline: none;
            border-color: var(--warning);
        }
        
        .question-btn {
            padding: 14px 28px;
            background: linear-gradient(135deg, var(--warning), #D97706);
            color: white;
            border: none;
            border-radius: 16px;
            font-weight: 600;
            cursor: pointer;
        }
        
        /* Ranking */
        .ranking-card {
            background: #F9FAFB;
            border-radius: 24px;
            padding: 24px;
            margin-top: 24px;
        }
        
        .ranking-title {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 20px;
            font-size: 1.3rem;
            color: #1F2937;
        }
        
        .ranking-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .ranking-item {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            background: white;
            border-radius: 16px;
            border: 1px solid #E5E7EB;
            transition: all 0.2s;
        }
        
        .ranking-item:hover {
            transform: translateX(4px);
            border-color: var(--primary);
        }
        
        .rank-position {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #F3F4F6;
            border-radius: 50%;
            font-weight: 700;
            margin-right: 12px;
        }
        
        .rank-1 {
            background: linear-gradient(135deg, #FBBF24, #F59E0B);
            color: white;
        }
        
        .rank-2 {
            background: linear-gradient(135deg, #9CA3AF, #6B7280);
            color: white;
        }
        
        .rank-3 {
            background: linear-gradient(135deg, #B45309, #92400E);
            color: white;
        }
        
        .rank-info {
            flex: 1;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .rank-balance {
            font-weight: 700;
            color: var(--primary);
            white-space: nowrap;
        }
        
        /* Mensagens */
        .message {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            padding: 16px 24px;
            border-radius: 100px;
            color: white;
            font-weight: 500;
            display: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            z-index: 1000;
            text-align: center;
            max-width: 90%;
        }
        
        .message.success {
            background: linear-gradient(135deg, var(--success), #059669);
        }
        
        .message.error {
            background: linear-gradient(135deg, var(--danger), #DC2626);
        }
        
        .message.info {
            background: linear-gradient(135deg, #3B82F6, #1D4ED8);
        }
        
        /* Footer */
        .footer {
            text-align: center;
            margin-top: 24px;
            color: rgba(255,255,255,0.8);
            font-size: 14px;
        }
        
        /* Responsivo */
        @media (max-width: 640px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }
            
            .user-area {
                flex-direction: column;
            }
            
            .btn {
                width: 100%;
            }
            
            .question-input {
                flex-direction: column;
            }
            
            .question-input input {
                width: 100%;
            }
            
            .question-input button {
                width: 100%;
            }
        }
    </style>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>
    <div class="container">
        <div class="header">

            <h1>Julia Rewards</h1>

        <div class="card">

            <div class="user-area">
                <div class="input-group">
                    <input type="text" id="userId" placeholder="Seu ID do Discord" value="1287695169587646508">

                    <input type="text" id="username" placeholder="Seu nome">
                </div>
                <button class="btn" onclick="loadUser()" id="loadBtn">
                    <span>📂</span> Carregar

            <div class="stats-grid">

            <!-- Timer -->
            <div class="timer-card">

            </div>
            
            <!-- Botão de resgate -->
            <button class="btn claim-btn" onclick="startClaim()" id="claimBtn">
                🎁 RESGATAR DIÁRIO

            <!-- Área da pergunta (inicialmente oculta) -->
            <div id="questionArea" class="question-card" style="display: none;">
                <div class="question-title">
                    <span>🎯</span>
                    <span>PERGUNTA BÔNUS</span>
                </div>
                <div class="question-text" id="questionText">Carregando...</div>
                <div class="question-input">
                    <input type="text" id="answerInput" placeholder="Digite sua resposta" autocomplete="off">
                    <button class="question-btn" onclick="checkAnswer()">Responder</button>
                </div>
                <div style="margin-top: 12px; font-size: 14px; color: #6B7280;">
                    ⏱️ Você tem 30 segundos para responder!
                </div>
            </div>
            
            <!-- Ranking -->
            <div class="ranking-card">
                <div class="ranking-title">
                    <span>🏆</span>
                    <span>TOP 10 USUÁRIOS</span>
                </div>
                <div class="ranking-list" id="rankingList">
                    <div style="text-align: center; padding: 20px; color: #6B7280;">
                        Carregando ranking...
                    </div>
                </div>
            </div>
        </div>
        
        <div class="footer">
            ✦ Resgate a cada 24h • Bônus de streak até 70% • Perguntas bônus ✦
        </div>
    </div>
    
    <!-- Mensagem flutuante -->
    <div id="message" class="message"></div>
    
    <script>
        // Configuração do Firebase
        const firebaseConfig = {

        // Inicializar Firebase

        const PERGUNTAS = [

            { pergunta: "Quanto é 7 x 8?", resposta: "56" },

        ];
        
        // ========== FUNÇÕES ==========
        
        // Mostrar mensagem
        function showMessage(text, type) {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.className = `message ${type}`;
            msg.style.display = 'block';
            
            setTimeout(() => {
                msg.style.display = 'none';
            }, 4000);
        }
        
        // Carregar usuário
        async function loadUser() {
            const userId = document.getElementById('userId').value.trim();
            if (!userId) {
                showMessage('Digite seu ID do Discord', 'error');
                return;
            }
            
            try {
                const snapshot = await db.ref('users/' + userId).once('value');
                let userData = snapshot.val();
                
                if (userData) {
                    currentUser = {
                        user_id: userId,
                        ...userData
                    };
                    document.getElementById('username').value = userData.name || '';
                } else {
                    // Criar usuário novo
                    const newUser = {
                        name: document.getElementById('username').value || 'Usuário',
                        bal: 0,
                        streak: 0,
                        total: 0,
                        last: null
                    };
                    await db.ref('users/' + userId).set(newUser);
                    currentUser = {
                        user_id: userId,
                        ...newUser
                    };
                }
                
                updateUI();
                showMessage('✅ Usuário carregado!', 'success');
                localStorage.setItem('lastId', userId);
                
            } catch (error) {
                showMessage('Erro ao carregar usuário', 'error');
                console.error(error);
            }
        }

                return;
