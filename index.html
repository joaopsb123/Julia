<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>🎁 Julia Rewards - Sistema de Resgate Diário</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', 'Segoe UI', sans-serif;
        }

        :root {
            --primary: #8B5CF6;
            --primary-dark: #7C3AED;
            --secondary: #EC4899;
            --success: #10B981;
            --warning: #F59E0B;
            --danger: #EF4444;
            --dark: #1F2937;
            --light: #F9FAFB;
            --gray: #9CA3AF;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 320"><path fill="%23ffffff" fill-opacity="0.1" d="M0,96L48,112C96,128,192,160,288,160C384,160,480,128,576,122.7C672,117,768,139,864,154.7C960,171,1056,181,1152,165.3C1248,149,1344,107,1392,85.3L1440,64L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z"></path></svg>') no-repeat bottom;
            background-size: cover;
            pointer-events: none;
        }

        .container {
            max-width: 800px;
            width: 100%;
            position: relative;
            z-index: 1;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            animation: fadeInDown 0.8s ease;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header h1 {
            font-size: clamp(2rem, 8vw, 3.5rem);
            color: white;
            text-shadow: 0 5px 15px rgba(0,0,0,0.3);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .header h1 span {
            background: rgba(255,255,255,0.2);
            padding: 5px 15px;
            border-radius: 50px;
            font-size: clamp(0.9rem, 4vw, 1.2rem);
            backdrop-filter: blur(5px);
        }

        .header p {
            color: rgba(255,255,255,0.9);
            font-size: clamp(1rem, 4vw, 1.2rem);
            text-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: clamp(20px, 5vw, 40px);
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            margin-bottom: 25px;
            animation: fadeInUp 0.8s ease;
            border: 1px solid rgba(255,255,255,0.2);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .user-section {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .input-group {
            flex: 1;
            position: relative;
            min-width: 200px;
        }

        .input-group i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gray);
            font-size: 1.2rem;
        }

        .input-group input {
            width: 100%;
            padding: 18px 18px 18px 50px;
            border: 2px solid #e0e0e0;
            border-radius: 15px;
            font-size: 16px;
            transition: all 0.3s;
            background: white;
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.1);
        }

        .btn {
            padding: 18px 30px;
            border: none;
            border-radius: 15px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            box-shadow: 0 10px 20px rgba(139, 92, 246, 0.3);
        }

        .btn:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(139, 92, 246, 0.4);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #f8f9fa, #e9ecef);
            border-radius: 20px;
            padding: 25px 20px;
            text-align: center;
            transition: all 0.3s;
            border: 1px solid rgba(255,255,255,0.5);
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .stat-icon {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .stat-label {
            color: var(--dark);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: clamp(1.5rem, 5vw, 2.5rem);
            font-weight: bold;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .timer-container {
            background: linear-gradient(135deg, #f8f9fa, #e9ecef);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 25px;
            text-align: center;
            border: 2px dashed var(--primary);
        }

        .timer-label {
            color: var(--dark);
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .timer-display {
            font-size: clamp(2rem, 8vw, 3.5rem);
            font-weight: bold;
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .claim-button {
            width: 100%;
            padding: 25px;
            font-size: clamp(1.1rem, 5vw, 1.5rem);
            margin-bottom: 25px;
            border-radius: 50px;
            background: linear-gradient(135deg, var(--success), #059669);
            color: white;
            border: none;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 20px 40px rgba(16, 185, 129, 0.3);
            position: relative;
            overflow: hidden;
        }

        .claim-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }

        .claim-button:hover:not(:disabled)::before {
            left: 100%;
        }

        .claim-button:hover:not(:disabled) {
            transform: translateY(-5px);
            box-shadow: 0 25px 50px rgba(16, 185, 129, 0.4);
        }

        .ranking-section {
            background: white;
            border-radius: 20px;
            padding: 25px;
        }

        .ranking-title {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            color: var(--dark);
            font-size: clamp(1.2rem, 5vw, 1.5rem);
        }

        .ranking-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .ranking-item {
            display: flex;
            align-items: center;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 15px;
            transition: all 0.3s;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-10px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .ranking-item:hover {
            transform: translateX(5px);
            background: #e9ecef;
        }

        .rank-position {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            margin-right: 15px;
            border-radius: 50%;
        }

        .rank-1 { background: linear-gradient(135deg, #FBBF24, #F59E0B); color: white; }
        .rank-2 { background: linear-gradient(135deg, #94A3B8, #64748B); color: white; }
        .rank-3 { background: linear-gradient(135deg, #B45309, #92400E); color: white; }
        .rank-default { background: #e5e7eb; color: var(--dark); }

        .rank-info {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .rank-username {
            font-weight: bold;
            color: var(--dark);
        }

        .rank-balance {
            font-size: 0.9rem;
            color: var(--primary);
            font-weight: bold;
        }

        .rank-medal {
            font-size: 1.5rem;
            margin-left: 10px;
        }

        .message {
            text-align: center;
            padding: 15px 20px;
            border-radius: 15px;
            margin-top: 20px;
            animation: slideIn 0.3s ease;
            font-weight: 500;
            display: none;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .message.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .footer {
            text-align: center;
            margin-top: 30px;
            color: rgba(255,255,255,0.8);
            font-size: 0.9rem;
        }

        @media (max-width: 480px) {
            .btn {
                width: 100%;
            }
            
            .stat-card {
                padding: 15px;
            }
            
            .claim-button {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>
                🎁 Julia Rewards
                <span>v2.0</span>
            </h1>
            <p>Resgate suas moedas diárias e suba no ranking!</p>
        </div>

        <div class="card">
            <div class="user-section">
                <div class="input-group">
                    <i>🔑</i>
                    <input type="text" id="userId" placeholder="Seu ID do Discord" value="">
                </div>
                <div class="input-group">
                    <i>👤</i>
                    <input type="text" id="username" placeholder="Seu nome (opcional)">
                </div>
                <button class="btn" onclick="loadUser()" id="loadBtn">
                    <span>📂</span> Carregar
                </button>
            </div>

            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon">💰</div>
                    <div class="stat-label">Saldo</div>
                    <div class="stat-value" id="balance">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">🔥</div>
                    <div class="stat-label">Streak</div>
                    <div class="stat-value" id="streak">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">📊</div>
                    <div class="stat-label">Total</div>
                    <div class="stat-value" id="totalEarned">0</div>
                </div>
            </div>

            <div class="timer-container">
                <div class="timer-label">⏳ PRÓXIMO RESGATE</div>
                <div class="timer-display" id="timer">--:--:--</div>
            </div>

            <button class="claim-button" onclick="claimDaily()" id="claimBtn">
                🎁 RESGATAR RECOMPENSA DIÁRIA
            </button>

            <div class="ranking-section">
                <div class="ranking-title">
                    <span>🏆</span>
                    <h2>TOP 10 USUÁRIOS</h2>
                </div>
                <div class="ranking-list" id="rankingList">
                    <div style="text-align: center; padding: 20px; color: var(--gray);">
                        Carregando ranking...
                    </div>
                </div>
            </div>

            <div id="message" class="message"></div>
        </div>

        <div class="footer">
            <p>Feito com ❤️ para a comunidade | Resgate disponível a cada 24h</p>
            <p style="font-size: 0.8rem; margin-top: 5px;">Bônus de streak: até +70%</p>
        </div>
    </div>

    <script>
        // Configuração da API (Netlify Functions)
        const API_URL = '/.netlify/functions';
        let currentUser = null;
        let timerInterval = null;

        // Carregar usuário
        async function loadUser() {
            const userId = document.getElementById('userId').value.trim();
            const loadBtn = document.getElementById('loadBtn');
            
            if (!userId) {
                showMessage('Por favor, digite seu ID do Discord', 'error');
                return;
            }

            if (!/^\d+$/.test(userId)) {
                showMessage('ID inválido! Deve conter apenas números', 'error');
                return;
            }

            loadBtn.innerHTML = '<span class="loading"></span> Carregando...';
            loadBtn.disabled = true;

            try {
                const response = await fetch(`${API_URL}/user?id=${userId}`);
                const data = await response.json();
                
                if (data.error) {
                    showMessage('Erro ao carregar usuário', 'error');
                } else {
                    currentUser = data;
                    document.getElementById('username').value = data.username || '';
                    updateUI();
                    showMessage('✅ Usuário carregado com sucesso!', 'success');
                    
                    // Salvar ID no localStorage
                    localStorage.setItem('lastUserId', userId);
                }
            } catch (error) {
                console.error('Erro:', error);
                showMessage('❌ Erro ao carregar usuário', 'error');
            } finally {
                loadBtn.innerHTML = '📂 Carregar';
                loadBtn.disabled = false;
            }
        }

        // Resgatar daily
        async function claimDaily() {
            if (!currentUser) {
                showMessage('⚠️ Carregue um usuário primeiro', 'error');
                return;
            }

            const username = document.getElementById('username').value.trim() || currentUser.username || 'Usuário';
            const claimBtn = document.getElementById('claimBtn');
            
            claimBtn.innerHTML = '<span class="loading"></span> PROCESSANDO...';
            claimBtn.disabled = true;

            try {
                const response = await fetch(`${API_URL}/claim`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        userId: currentUser.user_id,
                        username: username
                    })
                });

                const data = await response.json();
                
                if (data.success) {
                    showMessage(data.message, 'success');
                    await loadUser(); // Recarregar dados
                    confettiEffect();
                } else {
                    showMessage(data.message, 'error');
                    if (data.timeLeft) {
                        startTimer(data.timeLeft);
                    }
                }
            } catch (error) {
                console.error('Erro:', error);
                showMessage('❌ Erro ao resgatar', 'error');
            } finally {
                claimBtn.innerHTML = '🎁 RESGATAR RECOMPENSA DIÁRIA';
                claimBtn.disabled = false;
            }
        }

        // Efeito de confete
        function confettiEffect() {
            for (let i = 0; i < 30; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.style.position = 'fixed';
                    confetti.style.left = Math.random() * 100 + 'vw';
                    confetti.style.top = '-10px';
                    confetti.style.width = '10px';
                    confetti.style.height = '10px';
                    confetti.style.background = `hsl(${Math.random() * 360}, 100%, 50%)`;
                    confetti.style.borderRadius = '50%';
                    confetti.style.pointerEvents = 'none';
                    confetti.style.zIndex = '9999';
                    confetti.style.animation = `fall ${Math.random() * 3 + 2}s linear`;
                    document.body.appendChild(confetti);
                    
                    setTimeout(() => confetti.remove(), 5000);
                }, i * 100);
            }
        }

        // Adicionar estilo do confete
        const style = document.createElement('style');
        style.textContent = `
            @keyframes fall {
                to {
                    transform: translateY(100vh) rotate(360deg);
                }
            }
        `;
        document.head.appendChild(style);

        // Atualizar interface
        function updateUI() {
            if (currentUser) {
                document.getElementById('balance').text
