<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Julia Rewards - Resgate Diário</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            max-width: 600px;
            width: 100%;
        }
        
        .card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5em;
        }
        
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }
        
        .user-section {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        
        .user-section input {
            flex: 1;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            min-width: 200px;
        }
        
        .user-section input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .user-section button {
            padding: 15px 30px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        
        .user-section button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102,126,234,0.3);
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin: 20px 0;
        }
        
        .stat {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }
        
        .stat-label {
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 5px;
        }
        
        .stat-value {
            font-size: 2rem;
            font-weight: bold;
            color: #667eea;
        }
        
        .timer {
            background: #f8f9fa;
            border: 2px dashed #667eea;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            margin: 20px 0;
        }
        
        .timer-display {
            font-size: 2.5rem;
            font-weight: bold;
            color: #667eea;
            font-family: monospace;
        }
        
        .claim-btn {
            width: 100%;
            padding: 20px;
            font-size: 1.2rem;
            background: linear-gradient(135deg, #48bb78, #38a169);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin: 20px 0;
        }
        
        .claim-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(72,187,120,0.3);
        }
        
        .claim-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        .ranking {
            margin-top: 20px;
        }
        
        .ranking h3 {
            margin-bottom: 15px;
        }
        
        .ranking-item {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 8px;
            margin-bottom: 5px;
        }
        
        .message {
            text-align: center;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            display: none;
        }
        
        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        
        .footer {
            text-align: center;
            margin-top: 30px;
            color: rgba(255,255,255,0.8);
        }
    </style>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>🎁 Julia Rewards</h1>
            <div class="subtitle">Resgate suas moedas diárias!</div>
            
            <!-- Área do usuário -->
            <div class="user-section">
                <input type="text" id="userId" placeholder="Seu ID do Discord" value="1287695169587646508">
                <input type="text" id="username" placeholder="Seu nome">
                <button onclick="loadUser()" id="loadBtn">Carregar</button>
            </div>
            
            <!-- Stats -->
            <div class="stats">
                <div class="stat">
                    <div class="stat-label">💰 Saldo</div>
                    <div class="stat-value" id="balance">0</div>
                </div>
                <div class="stat">
                    <div class="stat-label">🔥 Streak</div>
                    <div class="stat-value" id="streak">0</div>
                </div>
                <div class="stat">
                    <div class="stat-label">📊 Total</div>
                    <div class="stat-value" id="total">0</div>
                </div>
            </div>
            
            <!-- Timer -->
            <div class="timer">
                <div>⏳ Próximo resgate</div>
                <div class="timer-display" id="timer">--:--:--</div>
            </div>
            
            <!-- Botão de resgate -->
            <button class="claim-btn" onclick="claimDaily()" id="claimBtn">
                🎁 RESGATAR DIÁRIO
            </button>
            
            <!-- Ranking -->
            <div class="ranking">
                <h3>🏆 Top 10</h3>
                <div id="rankingList"></div>
            </div>
            
            <!-- Mensagem -->
            <div id="message" class="message"></div>
        </div>
        
        <div class="footer">
            Resgate disponível a cada 24h | Bônus de streak: até +70%
        </div>
    </div>
    
    <script>
        // Configuração do Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyDJ_FRnNVJYOPbKUQZpx43WgYmqA-u-CB0",
            authDomain: "bot-discord-4d74d.firebaseapp.com",
            databaseURL: "https://bot-discord-4d74d-default-rtdb.firebaseio.com",
            projectId: "bot-discord-4d74d"
        };
        
        // Inicializar Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        
        // Variáveis globais
        let currentUser = null;
        let timerInterval = null;
        const DAILY_AMOUNT = 100;
        
        // Função para mostrar mensagem
        function showMessage(text, type) {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.className = `message ${type}`;
            msg.style.display = 'block';
            setTimeout(() => msg.style.display = 'none', 3000);
        }
        
        // Função para carregar usuário
        async function loadUser() {
            const userId = document.getElementById('userId').value.trim();
            if (!userId) {
                showMessage('Digite seu ID do Discord', 'error');
                return;
            }
            
            try {
                const snapshot = await db.ref('users/' + userId).once('value');
                const userData = snapshot.val();
                
                if (userData) {
                    currentUser = {
                        user_id: userId,
                        ...userData
                    };
                    document.getElementById('username').value = userData.name || '';
                } else {
                    // Criar usuário novo se não existir
                    const newUser = {
                        name: document.getElementById('username').value || 'Usuário',
                        bal: 0,
                        streak: 0,
                        total: 0,
                        last: null
                    };
                    await db.ref('users/' + userId).set(newUser);
                    currentUser = {
                        user_id: userId,
                        ...newUser
                    };
                }
                
                updateUI();
                showMessage('✅ Usuário carregado!', 'success');
                localStorage.setItem('lastId', userId);
                
            } catch (error) {
                showMessage('Erro ao carregar usuário', 'error');
                console.error(error);
            }
        }
        
        // Função para resgatar daily
        async function claimDaily() {
            if (!currentUser) {
                showMessage('Carregue um usuário primeiro', 'error');
                return;
            }
            
            const userId = currentUser.user_id;
            const userName = document.getElementById('username').value || currentUser.name || 'Usuário';
            
            try {
                // Buscar dados atualizados
                const snapshot = await db.ref('users/' + userId).once('value');
                let user = snapshot.val() || { bal: 0, streak: 0, last: null, total: 0 };
                
                const now = new Date();
                
                // Verificar se já resgatou hoje
                if (user.last) {
                    const last = new Date(user.last);
                    const timeDiff = (now - last) / 1000; // em segundos
                    
                    if (timeDiff < 86400) { // 24 horas
                        const timeLeft = 86400 - timeDiff;
                        startTimer(timeLeft);
                        showMessage('⏰ Você já resgatou hoje!', 'error');
                        return;
                    }
                }
                
                // Calcular streak
                let streak = 1;
                if (user.last) {
                    const last = new Date(user.last);
                    const hoursDiff = (now - last) / (1000 * 60 * 60); // em horas
                    if (hoursDiff < 48) { // 48 horas = 2 dias
                        streak = (user.streak || 0) + 1;
                    } else {
                        streak = 1;
                    }
                }
                
                // Calcular bônus (até 70%)
                const bonus = 1 + (Math.min(streak, 7) * 0.1);
                const amount = Math.floor(DAILY_AMOUNT * bonus);
                
                // Atualizar usuário
                user.bal = (user.bal || 0) + amount;
                user.last = now.toISOString();
                user.streak = streak;
                user.total = (user.total || 0) + amount;
                user.name = userName;
                
                // Salvar no Firebase
                await db.ref('users/' + userId).set(user);
                
                // Atualizar currentUser
                currentUser = user;
                currentUser.user_id = userId;
                
                updateUI();
                showMessage(`🎉 Resgatou ${amount} moedas! Streak: ${streak}`, 'success');
                confetti();
                
            } catch (error) {
                showMessage('Erro ao resgatar', 'error');
                console.error(error);
            }
        }
        
        // Função para carregar ranking
        async function loadRanking() {
            try {
                const snapshot = await db.ref('users').once('value');
                const users = snapshot.val() || {};
                
                const list = [];
                for (const id in users) {
                    const user = users[id];
                    if (user && user.name) {
                        list.push({
                            name: user.name,
                            bal: user.bal || 0
                        });
                    }
                }
                
                list.sort((a, b) => b.bal - a.bal);
                
                const rankingList = document.getElementById('rankingList');
                
                if (list.length === 0) {
                    rankingList.innerHTML = '<div class="ranking-item">Nenhum usuário no ranking</div>';
                    return;
                }
                
                let html = '';
                for (let i = 0; i < Math.min(10, list.length); i++) {
                    const user = list[i];
                    const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : `${i+1}.`;
                    html += `<div class="ranking-item"><span>${medal} ${user.name}</span><span>💰 ${user.bal}</span></div>`;
                }
                
                rankingList.innerHTML = html;
                
            } catch (error) {
                console.error('Erro ranking:', error);
            }
        }
        
        // Função para atualizar interface
        function updateUI() {
            if (currentUser) {
                document.getElementById('balance').textContent = currentUser.bal || 0;
                document.getElementById('streak').textContent = currentUser.streak || 0;
                document.getElementById('total').textContent = currentUser.total || 0;
                
                if (currentUser.last) {
                    const last = new Date(currentUser.last);
                    const next = last.getTime() + (24 * 60 * 60 * 1000);
                    const timeLeft = Math.max(0, (next - Date.now()) / 1000);
                    startTimer(timeLeft);
                } else {
                    startTimer(0);
                }
            }
        }
        
        // Função para iniciar timer
        function startTimer(seconds) {
            if (timerInterval) clearInterval(timerInterval);
            
            if (seconds <= 0) {
                document.getElementById('timer').textContent = '✅ Disponível!';
                return;
            }
            
            timerInterval = setInterval(() => {
                if (seconds <= 0) {
                    clearInterval(timerInterval);
                    document.getElementById('timer').textContent = '✅ Disponível!';
                    return;
                }
                
                const hours = Math.floor(seconds / 3600);
                const minutes = Math.floor((seconds % 3600) / 60);
                const secs = Math.floor(seconds % 60);
                
                document.getElementById('timer').textContent = 
                    `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
                
                seconds--;
            }, 1000);
        }
        
        // Função de confete
        function confetti() {
            for (let i = 0; i < 20; i++) {
                setTimeout(() => {
                    const conf = document.createElement('div');
                    conf.style.cssText = `
                        position: fixed;
                        left: ${Math.random() * 100}vw;
                        top: -10px;
                        width: 10px;
                        height: 10px;
                        background: hsl(${Math.random() * 360}, 100%, 50%);
                        border-radius: 50%;
                        pointer-events: none;
                        z-index: 9999;
                        animation: fall ${Math.random() * 3 + 2}s linear;
                    `;
                    document.body.appendChild(conf);
                    setTimeout(() => conf.remove(), 5000);
                }, i * 50);
            }
        }
        
        // Adicionar CSS da animação
        const style = document.createElement('style');
        style.textContent = '@keyframes fall { to { transform: translateY(100vh) rotate(360deg); } }';
        document.head.appendChild(style);
        
        // Carregar último ID salvo
        const savedId = localStorage.getItem('lastId');
        if (savedId) {
            document.getElementById('userId').value = savedId;
            setTimeout(loadUser, 500);
        }
        
        // Carregar ranking
        loadRanking();
        setInterval(loadRanking, 30000);
    </script>
</body>
</html>
