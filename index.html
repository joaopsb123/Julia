<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎁 Julia Rewards</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            width: 100%;
        }
        
        .card {
            background: white;
            border-radius: 30px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 2.5em;
        }
        
        .user-section {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        
        .input-group {
            flex: 1;
            min-width: 200px;
        }
        
        .input-group input {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 15px;
            font-size: 16px;
        }
        
        .input-group input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        button {
            padding: 15px 30px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102,126,234,0.4);
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin: 30px 0;
        }
        
        .stat-card {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
        }
        
        .stat-icon {
            font-size: 2rem;
            margin-bottom: 10px;
        }
        
        .stat-label {
            color: #666;
            font-size: 0.9rem;
        }
        
        .stat-value {
            font-size: 2rem;
            font-weight: bold;
            color: #667eea;
        }
        
        .timer-container {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 20px;
            margin: 20px 0;
            text-align: center;
            border: 2px dashed #667eea;
        }
        
        .timer-label {
            color: #666;
            margin-bottom: 10px;
        }
        
        .timer-display {
            font-size: 2.5rem;
            font-weight: bold;
            color: #667eea;
            font-family: monospace;
        }
        
        .claim-button {
            width: 100%;
            padding: 20px;
            font-size: 1.2rem;
            margin: 20px 0;
            background: linear-gradient(135deg, #48bb78, #38a169);
        }
        
        .ranking-section {
            margin-top: 30px;
        }
        
        .ranking-title {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .ranking-item {
            display: flex;
            justify-content: space-between;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
            margin-bottom: 10px;
        }
        
        .message {
            text-align: center;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            display: none;
        }
        
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .info { background: #d1ecf1; color: #0c5460; }
        
        .footer {
            text-align: center;
            margin-top: 30px;
            color: rgba(255,255,255,0.8);
        }
        
        @media (max-width: 600px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>🎁 Julia Rewards v2.0</h1>
            <p style="text-align: center; margin-bottom: 30px;">Resgate suas moedas diárias e suba no ranking!</p>
            
            <div class="user-section">
                <div class="input-group">
                    <input type="text" id="userId" placeholder="Seu ID do Discord" value="1287695169587646508">
                </div>
                <div class="input-group">
                    <input type="text" id="username" placeholder="Seu nome (opcional)">
                </div>
                <button onclick="loadUser()" id="loadBtn">Carregar</button>
            </div>

            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon">💰</div>
                    <div class="stat-label">SALDO</div>
                    <div class="stat-value" id="balance">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">🔥</div>
                    <div class="stat-label">STREAK</div>
                    <div class="stat-value" id="streak">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">📊</div>
                    <div class="stat-label">TOTAL</div>
                    <div class="stat-value" id="totalEarned">0</div>
                </div>
            </div>

            <div class="timer-container">
                <div class="timer-label">⏳ PRÓXIMO RESGATE</div>
                <div class="timer-display" id="timer">--:--:--</div>
            </div>

            <button class="claim-button" onclick="claimDaily()" id="claimBtn">
                🎁 RESGATAR RECOMPENSA DIÁRIA
            </button>

            <div class="ranking-section">
                <div class="ranking-title">
                    <span>🏆</span>
                    <h2>TOP 10 USUÁRIOS</h2>
                </div>
                <div id="rankingList">
                    <div style="text-align: center; padding: 20px;">Carregando ranking...</div>
                </div>
            </div>

            <div id="message" class="message"></div>
        </div>

        <div class="footer">
            <p>Feito com 🥰 para a comunidade | Resgate disponível a cada 24h</p>
            <p>Bônus de streak: até +70%</p>
        </div>
    </div>

    <script>
        const API_URL = '/.netlify/functions';
        let currentUser = null;
        let timerInterval = null;

        async function loadUser() {
            const userId = document.getElementById('userId').value.trim();
            const loadBtn = document.getElementById('loadBtn');
            
            if (!userId) {
                showMessage('Digite seu ID do Discord', 'error');
                return;
            }

            loadBtn.innerHTML = 'Carregando...';
            loadBtn.disabled = true;

            try {
                const response = await fetch(`${API_URL}/user?id=${userId}`);
                const data = await response.json();
                
                if (data.error) {
                    showMessage('Erro ao carregar usuário', 'error');
                } else {
                    currentUser = data;
                    document.getElementById('username').value = data.username || '';
                    updateUI();
                    showMessage('✅ Usuário carregado!', 'success');
                    localStorage.setItem('lastUserId', userId);
                }
            } catch (error) {
                showMessage('Erro de conexão', 'error');
            } finally {
                loadBtn.innerHTML = 'Carregar';
                loadBtn.disabled = false;
            }
        }

        async function claimDaily() {
            if (!currentUser) {
                showMessage('Carregue um usuário primeiro', 'error');
                return;
            }

            const username = document.getElementById('username').value.trim() || currentUser.username || 'Usuário';
            const claimBtn = document.getElementById('claimBtn');
            
            claimBtn.innerHTML = 'Processando...';
            claimBtn.disabled = true;

            try {
                const response = await fetch(`${API_URL}/claim`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        userId: currentUser.user_id,
                        username: username
                    })
                });

                const data = await response.json();
                
                if (data.success) {
                    showMessage(data.message, 'success');
                    await loadUser();
                    confetti();
                } else {
                    showMessage(data.message, 'error');
                    if (data.timeLeft) {
                        startTimer(data.timeLeft);
                    }
                }
            } catch (error) {
                showMessage('Erro ao resgatar', 'error');
            } finally {
                claimBtn.innerHTML = '🎁 RESGATAR RECOMPENSA DIÁRIA';
                claimBtn.disabled = false;
            }
        }

        function confetti() {
            for (let i = 0; i < 20; i++) {
                setTimeout(() => {
                    const conf = document.createElement('div');
                    conf.style.position = 'fixed';
                    conf.style.left = Math.random() * 100 + 'vw';
                    conf.style.top = '-10px';
                    conf.style.width = '10px';
                    conf.style.height = '10px';
                    conf.style.background = `hsl(${Math.random() * 360}, 100%, 50%)`;
                    conf.style.borderRadius = '50%';
                    conf.style.pointerEvents = 'none';
                    conf.style.zIndex = '9999';
                    conf.style.animation = `fall ${Math.random() * 3 + 2}s linear`;
                    document.body.appendChild(conf);
                    setTimeout(() => conf.remove(), 5000);
                }, i * 100);
            }
        }

        const style = document.createElement('style');
        style.textContent = `
            @keyframes fall {
                to { transform: translateY(100vh) rotate(360deg); }
            }
        `;
        document.head.appendChild(style);

        async function loadRanking() {
            try {
                const response = await fetch(`${API_URL}/top`);
                const users = await response.json();
                
                const rankingList = document.getElementById('rankingList');
                
                if (!users || users.length === 0) {
                    rankingList.innerHTML = '<div style="text-align: center; padding: 20px;">Nenhum usuário no ranking</div>';
                    return;
                }
                
                rankingList.innerHTML = users.map((user, i) => {
                    const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : `${i+1}.`;
                    return `
                        <div class="ranking-item">
                            <span>${medal} ${user.username}</span>
                            <span>💰 ${user.balance}</span>
                        </div>
                    `;
                }).join('');
                
            } catch (error) {
                document.getElementById('rankingList').innerHTML = 
                    '<div style="text-align: center; padding: 20px;">Erro ao carregar ranking</div>';
            }
        }

        function updateUI() {
            if (currentUser) {
                document.getElementById('balance').textContent = currentUser.balance || 0;
                document.getElementById('streak').textContent = currentUser.daily_streak || 0;
                document.getElementById('totalEarned').textContent = currentUser.total_earned || 0;
                
                if (currentUser.last_daily) {
                    const last = new Date(currentUser.last_daily);
                    const next = new Date(last.getTime() + 24*60*60*1000);
                    const timeLeft = Math.max(0, (next - new Date()) / 1000);
                    
                    if (timeLeft > 0) startTimer(timeLeft);
                    else document.getElementById('timer').textContent = '✅ DISPONÍVEL!';
                }
            }
        }

        function startTimer(seconds) {
            if (timerInterval) clearInterval(timerInterval);
            
            function update() {
                if (seconds <= 0) {
                    clearInterval(timerInterval);
                    document.getElementById('timer').textContent = '✅ DISPONÍVEL!';
                    return;
                }
                
                const h = Math.floor(seconds / 3600);
                const m = Math.floor((seconds % 3600) / 60);
                const s = Math.floor(seconds % 60);
                
                document.getElementById('timer').textContent = 
                    `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
                
                seconds--;
            }
            
            update();
            timerInterval = setInterval(update, 1000);
        }

        function showMessage(text, type) {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.className = `message ${type}`;
            msg.style.display = 'block';
            setTimeout(() => msg.style.display = 'none', 3000);
        }

        // Auto-carregar ID salvo
        const savedId = localStorage.getItem('lastUserId');
        if (savedId) {
            document.getElementById('userId').value = savedId;
            setTimeout(loadUser, 500);
        }

        // Carregar ranking
        loadRanking();
        setInterval(loadRanking, 30000);
    </script>
</body>
    </html>
